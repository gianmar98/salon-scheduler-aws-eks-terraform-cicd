# NOT APPLIED. Kept alongside the other two manifests; Terraform builds this instead.
#
# WHAT IT DESCRIBES
# The identity a pod runs as. Programs in a cluster get service accounts the way people
# get user accounts — this is the answer to "who is this pod". Pod Identity maps the name
# to the app's IAM role, which is how the pods reach DynamoDB and RDS.
#
# WHY IT IS COMMENTED OUT
# It creates nothing outside the cluster and holds no generated values, so for a while it
# stayed kubectl's. That was wrong for a different reason: nothing can run without it.
# The admission controller rejects every pod whose serviceAccountName does not resolve, so
# on a cold rebuild the Terraform-managed Deployment sits at 0 of 2 replicas until
# `wait_for_rollout` gives up ten minutes later:
#
#   Error creating: pods "appointments-deployment-..." is forbidden: error looking up
#   service account default/appointments-sa: serviceaccount "appointments-sa" not found
#
# A "run this once first" prerequisite is exactly what this project does not allow.
#
# The same ServiceAccount is declared in
# infrastructure/modules/eks/k8s_service_account.tf as a kubernetes_service_account_v1
# resource, behind the same eks_app_enabled flag as the Service and the Deployment. The
# Deployment carries an explicit depends_on because serviceAccountName is a plain string
# that Terraform cannot trace back to the resource.
#
# Applying this file would hand Terraform an object it did not create; the next apply
# fails with "serviceaccounts appointments-sa already exists".
#
# apiVersion: v1
# kind: ServiceAccount
# metadata:
#   name: appointments-sa
